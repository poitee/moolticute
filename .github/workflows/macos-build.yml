name: macOS build

on:
  push:
    branches: [master, 'feature/apple-silicon-*']
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # make_version needs git describe --tags; a shallow clone has no
          # tags and the build dies before compiling anything
          fetch-depth: 0

      - name: Install Go (pinned)
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Qt 6.2.4 (pinned, official binaries)
        run: |
          pipx install aqtinstall
          aqt install-qt mac desktop 6.2.4 clang_64 -m qtwebsockets -O "$HOME/Qt"
          echo "QTDIR=$HOME/Qt/6.2.4/macos" >> "$GITHUB_ENV"

      - name: Build and package
        run: ./scripts/macos/build-local.sh --package

      - name: Verify native arm64 architecture
        run: |
          for bin in \
            build/Moolticute.app/Contents/MacOS/moolticute \
            build/Moolticute.app/Contents/MacOS/moolticuted \
            build/Moolticute.app/Contents/MacOS/cli/mc-agent \
            build/Moolticute.app/Contents/MacOS/cli/mc-cli
          do
            file "$bin"
            archs="$(lipo -archs "$bin")"
            if [ "$archs" != "arm64" ]; then
              echo "ERROR: $bin is '$archs', expected arm64"
              exit 1
            fi
          done

      - name: Run tests
        working-directory: build
        run: ./tests/tests

      - name: Zip app bundle for artifact upload
        working-directory: build
        run: ditto -c -k --sequesterRsrc --keepParent Moolticute.app Moolticute-macos-arm64-app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moolticute-macos-arm64-app
          path: build/Moolticute-macos-arm64-app.zip
          if-no-files-found: error
