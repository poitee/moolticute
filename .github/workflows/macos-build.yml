name: macOS build

on:
  push:
    branches: [master, 'feature/apple-silicon-*']
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # make_version needs git describe --tags; a shallow clone has no
          # tags and the build dies before compiling anything
          fetch-depth: 0

      - name: Install dependencies
        run: brew install qt go

      - name: Build and package
        run: ./scripts/macos/build-local.sh --package

      - name: Verify architecture
        run: |
          file build/Moolticute.app/Contents/MacOS/moolticute
          lipo -info build/Moolticute.app/Contents/MacOS/moolticute

      - name: Run tests
        working-directory: build
        run: ./tests/tests

      - name: Zip app bundle for artifact upload
        working-directory: build
        run: ditto -c -k --sequesterRsrc --keepParent Moolticute.app Moolticute-macos-arm64-app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moolticute-macos-arm64-app
          path: build/Moolticute-macos-arm64-app.zip
          if-no-files-found: error
